{% load static %}
<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobly</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    {% block head %}{% endblock %}
</head>
<body>
    {% block header %}{% include "core/nav.html" %}{% endblock %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block footer %}{% include "core/footer.html" %}{% endblock %}
    {% include "core/_icon_sprite.html" %}
    <script src="{% static 'js/site.js' %}"></script>
</body>
</html>
