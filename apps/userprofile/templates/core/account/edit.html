{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static '/scss/userprofile/myaccount.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/userprofile/account/edit.css' %}" type="text/css">
<script rel="stylesheet" src="{% static '/js/account.js' %}" type="text/javascript"></script>
<link rel="stylesheet" href="{% static '/scss/pages/page.css' %}" type="text/css">

<div class="account-nav-mob">
    <div class="logo" onclick="window.location.href='/min-bruker/'">
        <img src="{% static 'images/logo/logo2.png' %}" alt="" class="logo-image">
    </div>
    <div class="hamburger" id="Acnthamburger" onclick="Acntmenu()">
        <span class="upper-span"></span>
        <span class="center-span"></span>
        <span class="lower-span"></span>
    </div>
    <div class="sidebar" id="Acntsidebar">
        <a href="/">Tilbake hjem<i class="fa-solid fa-angle-right"></i></a>
        <a href="/min-bruker/mine-annonser/">Mine annonser<i class="fa-solid fa-angle-right"></i></a>
        <a href="/min-bruker/mine-bud/">Mine bud<i class="fa-solid fa-angle-right"></i></a>
        <a href="/min-bruker/mine-kjøp/">Mine Kjøp<i class="fa-solid fa-angle-right"></i></a>
        <a href="/min-bruker/kommende-visninger/">Kommende visninger<i class="fa-solid fa-angle-right"></i></a>
        <a href="/min-bruker/rediger-min-info/">Endre min info<i class="fa-solid fa-angle-right"></i></a>
    </div>
</div>

<div class="account-card">
    <div class="text">
        <h1 class="heading">Endre min info</h1>
    </div>
    <div class="flex">
        <div class="your-info">
            <div class="user-info">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{u_form.errors}}
                    <br>
                    <label for="username">Brukernavn</label>
                    <br>
                    <input id="username" name="username" type="text" value="{{ request.user.username}}">
                    <br>
                    <br>
                    <label for="first_name">Fornavn</label>
                    <br>
                    <input id="first_name" name="first_name" type="text" value="{{ request.user.first_name }}">
                    <br>
                    <br>
                    <label for="last_name">Etternavn</label>
                    <br>
                    <input id="last_name" name="last_name" type="text" value="{{request.user.last_name}}">
                    <br>
                    <br>
                    <label for="email">Epost</label>
                    <br>
                    <input id="email" name="email" type="text" value="{{ request.user.email }}">
                    <br>
                    <br>
                    <button type="submit">Endre info</button>
                </form>
            </div>

 
        </div>
    </div>
</div>


<div class="account-footer-mob">
    <p>&#169; 2023 Bilmeglerne AS</p>
</div>
{% endblock %}
