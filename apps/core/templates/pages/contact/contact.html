{% extends 'core/base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static '/scss/pages/contact.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/pages/page.css' %}" type="text/css">

<div class="page">
    <div class="cover">
        <div class="content" style="padding-bottom: 15px;">
            <div class="text">
                <h1 class="cover-h1">Kontakt oss</h1>
                <p class="cover-p">Bruk skjema under så svarer vi så fort vi kan</p>
            </div>  
        </div>
    </div>
    <form id="contactUs" action="" method="POST">
        {% csrf_token %}
        <br>
        <div class="inputs-labels">
           <label for="navn">Navn</label>
           <br>
           <input type="text" name="name" id="name" required  oninput="this.setCustomValidity('')" value="{{request.user.get_full_name}}">
           <br>
           <br>
           <label for="email">Epost</label>
           <br>
           <input type="email" name="email" id="email"  required oninput="this.setCustomValidity('')" value="{{request.user.email}}">
           <br>
           <br>
           <label for="message">Hvordan kan vi hjelpe?</label>
           <br>
           <textarea name="message" id="message"  required oninput="this.setCustomValidity('')"></textarea>
          </div>
        <div class="form-actions">
          <button class="primary" type="submit" name="contact" value="contact">Send melding</button>
        </div>
      </form>
</div>



{% endblock %}
