{% extends 'core/base.html' %}    
{% load static %}    
    

{% block content %}
<link rel="stylesheet" href="{% static '/scss/userprofile/login.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/forms/form.css' %}" type="text/css">
<script rel="stylesheet" src="{% static '/js/login.js' %}" type="text/javascript"></script>



<div class="login">
    <!-- USER LOGIN -->
    <form id="loginForm" method="post" autocomplete="off">
        <div class="text">
            <h1 class="heading">Glemt passord</h1>
        </div>
        {% csrf_token %}
        <div class="form">
            <!-- <button class="vipps">Logg inn med vipps</button>
            <div class="or-vipps">
                <span></span>
                <p>Eller bruk</p>
                <span></span>
            </div> -->
            <div class="inputs-labels">
                <!-- NAME -->
                <label for="username">Epost</label>
                <br>
                <input type="text" name="email" id="email" autocomplete="off" required oninvalid="this.setCustomValidity('Kan ikke være tom')" oninput="this.setCustomValidity('')">
            </div> 
            <div class="form-actions">
                <button type='submit'>Send</button>
            </div>
        </div>
        <br>
    </form>
</div>
{% endblock %}
