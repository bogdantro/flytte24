<script rel="stylesheet" src="{% static '/js/nav.js' %}" type="text/javascript"></script>
<link rel="stylesheet" href="{% static '/scss/nav.css' %}" type="text/css">
<link rel="preconnect" href="https://fonts.gstatic.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<div id="mobileNav" style=" border-bottom: 1px solid lightgray;">
    <div class="logo" onclick="window.location.href='/for-bedrifter/'">
        <img src="{% static 'images/logo/logo-business.png' %}" alt="">
    </div>
   
    {% if request.user.authenticated %}
    <a href="/for-bedrifter/min-bruker/" style="color: #1F1F1F; font-size: 16px;">Min bruker</a>
    {% else %}
    <a href="/for-bedrifter/bruker/logg-inn/" style="color: #1F1F1F; font-size: 16px;">Logg inn</a>
    {% endif %}

   
</div>


<div id="desNav">
    <div class="desnav-content">
        <div class="left">
            <div class="logo" onclick="window.location.href='/for-bedrifter/'">
                <img src="{% static 'images/logo/logo-business.png' %}" alt="">
            </div>
        </div>
        <div class="cta">
            {% if request.user.is_authenticated %}
                <a href="/for-bedrifter/min-bruker/" style="color: #1F1F1F; font-size: 16px;">Min bruker</a>
            {% else %}
                <a href="/for-bedrifter/bruker/logg-inn/" style="color: #1F1F1F; font-size: 16px;">Logg inn</a>
            {% endif %}

        </div>
    </div>
</div>
