{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static '/scss/pages/page.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/pages/buy.css' %}" type="text/css">


<div class="page">
    <div class="buy">
        <div class="text">
            <h1>Biler til salgs</h1>
        </div>
        <div class="cars">
            {% for car in car %}
            <div class="car">
                <div class="top">
                    <img src="{{car.image1.url}}" alt="" class="car-image" onclick="window.location.href='{% url  'car_detail' car.slug  %}'">
                </div>
                <div class="bottom">
                      <div class="name"><strong style="font-weight: 600 !important;">{{car.year}} {{car.name}}</strong> {{car.car_model}}</div>
                      <!-- <div class="adress">{{car.adress}}</div> -->
                      <div class="flex">
                            <div class="price">{{car.price}}kr</div>
                            <div class="km">{{car.km}}km</div>
                      </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
