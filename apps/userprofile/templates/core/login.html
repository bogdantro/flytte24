{% extends 'core/base.html' %}
{% load static %}

{% block head %}
<title>Logg inn</title>
<meta name="author" content="Innlandet Søk">
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static '/scss/userprofile/signup.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/userprofile/login.css' %}" type="text/css">

<div class="signup-wrapper">
  <div class="signup-form">
    <h1>Logg inn på kontoen din</h1>

    <form id="loginForm" method="post" autocomplete="off">
      {% csrf_token %}

      <!-- STEP 1: EMAIL -->
      <div id="email-step">
        <label for="username">E-postadresse</label>
        <input type="email" id="username" name="username" placeholder="Din e-post" required>
        <p class="form-info" id="emailInfo"></p>
        <div class="form-actions">
          <button type="button" id="checkEmailBtn">Fortsett</button>
        </div>
      </div>

      <!-- STEP 2: PASSWORD -->
      <div id="password-step" class="hidden">
        <div class="login-header">
          <p>Logg inn med: <br> <span id="userEmail" class="user-email"></span></p>
          
          <button type="button" id="changeEmail" class="change-btn">Endre</button>
        </div>
        <br>

        <label for="password">Passord</label>
        <div class="password-row">
          <input type="password" id="password" name="password" placeholder="Passord" required>
          <i id="togglePassword" class="fa-regular fa-eye"></i>
        </div>

        <a href="/password-reset/" class="forgot-link">Glemt passord?</a>

        <div class="form-actions">
          <button type="submit">Logg inn</button>
        </div>
      </div>
    </form>

    <p class="alt-link">
      Har du ikke konto? <a href="/for-bedrifter/bli-partner/">Opprett en her</a>
    </p>
  </div>
</div>



<script>
document.addEventListener("DOMContentLoaded", () => {
  const emailStep = document.getElementById("email-step");
  const passwordStep = document.getElementById("password-step");
  const emailInput = document.getElementById("username");
  const emailInfo = document.getElementById("emailInfo");
  const checkEmailBtn = document.getElementById("checkEmailBtn");
  const userEmail = document.getElementById("userEmail");
  const changeEmail = document.getElementById("changeEmail");
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");

  checkEmailBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();

    if (!email) {
      emailInfo.textContent = "Skriv inn e-postadressen din.";
      emailInfo.style.color = "#d93025";
      return;
    }

    emailInfo.textContent = "Sjekker brukerkonto...";
    emailInfo.style.color = "#444";

    try {
const response = await fetch(`/api/check-user/?username=${encodeURIComponent(email)}`);
      const data = await response.json();

      if (data.exists) {
        // Vis passordfelt
        userEmail.textContent = email;
        emailStep.classList.add("hidden");
        passwordStep.classList.remove("hidden");
        emailInfo.textContent = "";
      } else {
        emailInfo.textContent = "Ingen konto funnet med denne e-posten.";
        emailInfo.style.color = "#d93025";
      }
    } catch (error) {
      console.error("Feil ved sjekk:", error);
      emailInfo.textContent = "Noe gikk galt. Prøv igjen senere.";
      emailInfo.style.color = "#d93025";
    }
  });

  changeEmail.addEventListener("click", () => {
    passwordStep.classList.add("hidden");
    emailStep.classList.remove("hidden");
    emailInput.focus();
  });

  togglePassword.addEventListener("click", () => {
    const type =
      passwordInput.getAttribute("type") === "password" ? "text" : "password";
    passwordInput.setAttribute("type", type);
    togglePassword.classList.toggle("fa-eye-slash");
  });
});
</script>


{% endblock %}
