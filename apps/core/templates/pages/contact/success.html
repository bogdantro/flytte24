{% extends 'core/base.html' %}
{% load static %}

{% block content %}

{% block head %}
<title>Vi har motatt din henvendelse</title>
<meta name="description" content="Bilmeglerne har spesialisert seg på salg av bil. Vi har utviklet denne tjenesten for å gjøre deg trygg på at bilsalget foregår i henhold til gjeldende lover og forskrifter">
<meta name="author" content="Bilmeglerne">
<meta name="keywords" content="Bilmeglerne, Selge bil, Kjøpe bil, Biler til salg, Kjøp ny bil, Kjøp en bil, Bil, Biler, Bilene">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.get_full_path }}">
<meta property="og:description" content="Bilmeglerne har spesialisert seg på salg av bil. Vi har utviklet denne tjenesten for å gjøre deg trygg på at bilsalget foregår i henhold til gjeldende lover og forskrifter">
{% endblock %}

<link rel="stylesheet" href="{% static '/scss/pages/verdi.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/pages/page.css' %}" type="text/css">

<div class="page" style="display: block; text-align: center;  padding-inline: 0; background: linear-gradient(to bottom right, rgba(255, 240, 180, 0.185), transparent);">
    <div class="cover" style="margin: unset; text-align: center; width: 100%; position: relative; left: 50%; transform: translateX(-50%);" >
        <div class="content" style="padding-inline: 20px; text-align: center; width: 100%; padding-block: 40px; margin: auto; max-width: 1290px;">
            <div class="text" style="text-align: center; width: 100%; ">
                <h1 class="cover-h1" >Vi kommer tilbake til deg!</h1>
                <p style="width: 100%; max-width: 100%;" class="cover-p">Vi har mottatt din henvendelse, og vil kontakte deg så fort som mulig</p>
            </div>  
            <button onclick="window.location.href='/'">Til hjemmesiden</button>
        </div>
    </div>
</div>

<style type="text/css">
        button{
            position: relative;
            left: 50%;
            transform: translateX(-50%);
                  border: 1px solid transparent;
                  border-radius: 6px;
                  outline: none !important;
                  background: #f0a432;
                  color: white;
                  font-weight: 500;
                  font-size: 17px;
                  width: 240px;
                  display: block;
                  height: 43px;
                  margin-top: 29px;
                }
                  button:hover{
                    filter: brightness(89%);
                    transform: translateX(-50%);
                }
                    button:focus{
                    filter: brightness(89%);
                    transform: scale(0.95) translateX(-53%);
                    }
</style>



{% endblock %}
