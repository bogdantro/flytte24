{% extends 'core/base.html' %}    
{% load static %}    
    

{% block content %}
{% block head %}
<title>Logg inn</title>
<meta name="author" content="Innlandet Søk">
{% endblock %}
<link rel="stylesheet" href="{% static '/scss/userprofile/login.css' %}" type="text/css">
<script rel="stylesheet" src="{% static '/js/login.js' %}" type="text/javascript"></script>


<div class="login-page">

   <div class="form">

       <h1 class="heading">Login</h1>
       <p class="or-signup"><a href="/signup/">Or make an account</a></p>
       <form id="loginForm" method="post">
           {% csrf_token %}
           {% if message %}
           <div class="alert alert-success">
               {{message}}
           </div>
           {% endif %}
           <!-- USER LOGIN FORM INPUTS -->
           <div class="inputs-labels">
               {% if form.errors %}
                   <div class="alert alert-danger">
                       <strong>{{errors}}</strong>
                   </div>
               {% endif %}
               <!-- NAME -->
               <label for="username">Email</label>
               <br>
               <input type="email" id="username" name="username" required oninvalid="this.setCustomValidity('Kan ikke være tom')" oninput="this.setCustomValidity('')">
               <br>
               <br>
               <!-- PASSWORD -->
               <label for="password">Password</label>
               <br>
               <input type="password" id="password" name="password" required oninvalid="this.setCustomValidity('Kan ikke være tom')" oninput="this.setCustomValidity('')">
               <br>
           </div> 
           <div class="form-actions">
               <button type='submit'>Login</button>
           </div>
       </form>
   </div>
   
</div>
<div class="image">
     <img src="{% static '/images/covers/login.jpg' %}" alt="">
</div>

{% endblock %}
