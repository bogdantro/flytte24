{% extends 'core/base.html' %}    
{% load static %}    
    

{% block content %}
{% block head %}
<title>Bedrift-ressurser</title>
<meta name="author" content="Innlandet Søk">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.get_full_path }}">
{% endblock %}

<link rel="stylesheet" href="{% static '/scss/userprofile/myaccount.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/pages/page.css' %}" type="text/css">
<link rel="stylesheet" href="{% static '/scss/userprofile/account/resources.css' %}" type="text/css">
<script rel="stylesheet" src="{% static '/js/myaccount.js' %}" type="text/javascript"></script>



<div class="page">
    <div class="cover">
        <div class="content">
            <div class="text">
                <h1>Bedrift-ressurser</h1>
                <div class="back" onclick="window.location.href='/min-bruker/'">
                    <i class="fa-solid fa-angle-left arrow"></i>
                    <h1>Tilbake</h1>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="resource" style="border: 1px solid lightgray;">
            <div class="top">
                <img src="{% static 'images/other/webiser.png' %}" alt="">
            </div>
            <hr>
            <div class="bottom">
                <h1>Nettside lønsing levert av Webiser. Bruk rabattkoden "InnlandetSøk" når du kontakter de for 10% rabatt.</h1>
                <br>
                <button onclick="window.location.href='https://webiser.no/'">Besøk Webiser</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}
