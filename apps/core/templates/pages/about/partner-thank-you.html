<!-- apps/core/templates/pages/about/partner-thank-you.html -->
{% load static %}
<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kobly</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'scss/wizard.css' %}">
</head>
<body>

<!-- Same structure/classes as apps/leads/templates/leads/thank_you.html, with copy
     adapted for a business-partner application instead of a customer lead. -->
<div class="thankyou">
  <div class="thankyou__background" aria-hidden="true">
    <img src="{% static 'images/wizard/boxes-and-plants.jpg' %}" alt="">
    <div class="thankyou__background-scrim"></div>
  </div>

  <div class="thankyou-card">
    <div class="thankyou-illustration">
      <span class="thankyou-illustration__logo">
        <svg width="24" height="24" viewBox="0 0 27 27" fill="none" aria-hidden="true">
          <circle cx="13.5" cy="13.5" r="11.625" stroke="currentColor" stroke-width="3.75" />
          <path d="M16.5 1.875C12.7075 5.23556 10.5 9.26144 10.5 13.5887C10.5 17.8401 12.6307 21.8006 16.3019 25.125" stroke="currentColor" stroke-width="3.75" />
        </svg>
      </span>
      <span class="thankyou-illustration__dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <!-- One business per application (unlike the leads flow's 3-box routing
           illustration this was copied from) — shows the company name the
           applicant just typed into the wizard instead of generic icons. -->
      <span class="thankyou-illustration__name">{{ company_name }}</span>
    </div>

    <h1 class="thankyou-card__title">Søknaden er sendt!</h1>
    <p class="thankyou-card__body">Vi går gjennom søknaden din og tar kontakt innen kort tid. Neste steg er å opprette en bruker, slik at du er klar til å motta leads så snart søknaden er godkjent.</p>
    <a href="/reg/fullfor/lag-bruker/{% if email %}?email={{ email|urlencode }}{% endif %}" class="btn-primary btn-primary--full">Opprett bruker</a>
  </div>
</div>

</body>
</html>
