{% extends 'core/accountPages/_account_base.html' %}

{% block page_title %}Innstillinger{% endblock %}

{% block content %}
<section class="portal-page">
  <div class="portal-heading-row">
    <h1 class="portal-heading">Innstillinger</h1>
  </div>

  <div class="portal-card">
    <p class="portal-card__title">Bytt passord</p>

    {% if form.errors %}
    <div class="account-card__errors" role="alert">
      {{ form.non_field_errors }}
      {% for field in form %}{{ field.errors }}{% endfor %}
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label class="portal-form__group">
        <span class="field-label">Nåværende passord</span>
        <input type="password" name="old_password" autocomplete="current-password" autofocus required>
      </label>
      <label class="portal-form__group">
        <span class="field-label">Nytt passord</span>
        <input type="password" name="new_password1" autocomplete="new-password" required>
      </label>
      <label class="portal-form__group">
        <span class="field-label">Bekreft nytt passord</span>
        <input type="password" name="new_password2" autocomplete="new-password" required>
      </label>
      <button type="submit" class="btn-primary">Lagre nytt passord</button>
    </form>
  </div>
</section>
{% endblock %}
