{% extends 'core/base.html' %}    
{% load static %}    
    

{% block content %}
{% block head %}
<title>Logg inn</title>
<meta name="author" content="Innlandet Søk">
{% endblock %}
<link rel="stylesheet" href="{% static '/scss/userprofile/login.css' %}" type="text/css">
<script rel="stylesheet" src="{% static '/js/login.js' %}" type="text/javascript"></script>


<div class="login page-for-form">

    <!-- USER LOGIN -->
    <h1 class="heading">Logg inn</h1>
    <p class="or-signup"><a href="/lag-bruker/">Eller lag bruker</a></p>
    <form id="loginForm" method="post">
        {% csrf_token %}
        {% if message %}
        <div class="alert alert-success">
            {{message}}
        </div>
        {% endif %}
        <!-- USER LOGIN FORM INPUTS -->
        <div class="inputs-labels">
            {% if form.errors %}
                <div class="alert alert-danger">
                    <strong>Epost eller passord er feil</strong>
                </div>
            {% endif %}
            <!-- NAME -->
            <label for="username">Epost</label>
            <br>
            <input type="email" id="username" name="username" required oninvalid="this.setCustomValidity('Kan ikke være tom')" oninput="this.setCustomValidity('')">
            <br>
            <br>
            <!-- PASSWORD -->
            <label for="password">Passord</label>
            <br>
            <input type="password" id="password" name="password" required oninvalid="this.setCustomValidity('Kan ikke være tom')" oninput="this.setCustomValidity('')">
            <br>
        </div> 
        <div class="form-actions">
            <button type='submit'>Logg inn</button>
        </div>
    </form>
</div>
<div class="black-overlay" id="blackOverlay"></div>

{% endblock %}
